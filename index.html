<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Volleyball Stats — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <h1>Volleyball Stats</h1>
    <p class="auth-sub">Track in-game performance with your team.</p>

    <div class="tab-row">
      <button class="tab-btn active" id="tab-login" onclick="showTab('login')">Log In</button>
      <button class="tab-btn" id="tab-signup" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" />
      </div>
      <button class="btn-primary" onclick="login()">Log In</button>
    </div>

    <!-- Signup Form -->
    <div id="form-signup" style="display:none">
      <div class="field">
        <label>Display Name</label>
        <input type="text" id="signup-name" placeholder="Your name" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="signup-password" placeholder="Min. 6 characters" />
      </div>
      <button class="btn-primary" onclick="signup()">Create Account</button>
    </div>

    <p id="auth-error" class="error-msg"></p>
  </div>

  <script type="module" src="auth.js?v=20260609-position-charts"></script>
</body>
</html>
